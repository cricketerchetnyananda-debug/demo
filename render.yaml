# Render Blueprint: one web service (API + Angular pages) and one PostgreSQL database.
# In Render: New > Blueprint > pick this GitHub repo > Apply.
services:
  - type: web
    name: school-attendance
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: school-attendance-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN_SECONDS
        value: "28800"
      - key: DB_SYNC
        value: "true"

databases:
  - name: school-attendance-db
    plan: free
    databaseName: school_attendance
    user: attendance_app
